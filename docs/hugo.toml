baseURL = '/'
title = 'Limanix'
locale = 'en-US'
disableKinds = ['taxonomy', 'term', 'RSS']

[module]
  [[module.imports]]
    path = 'github.com/alex-shpak/hugo-book'
  [[module.mounts]]
    source = 'pages'
    target = 'content'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = '../.github/assets/readme-header.png'
    target = 'assets/readme-header.png'
  [[module.mounts]]
    source = '../limanix.example.toml'
    target = 'assets/limanix.example.toml'
  [[module.mounts]]
    source = '../examples'
    target = 'assets/examples'

[params]
  BookSection = '*'
  BookTheme = 'auto'
  BookToC = true
  BookSearch = true
  BookComments = false
  BookPortableLinks = 'error'

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# Generated reference tables contain escaped values inside HTML code elements.
[markup.goldmark.renderer]
  unsafe = true
