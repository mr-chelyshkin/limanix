[project]
name = "limanix"
version = "0.1.0"
description = "Development sandboxes with Lima and NixOS."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
limanix = "limanix.cli:main"

[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]
