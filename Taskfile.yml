# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3.53.1'

includes:
  python:
    taskfile: https://raw.githubusercontent.com/mr-chelyshkin/tasks/v0.0.2/taskfiles/python/Taskfile.yml
    internal: true
    vars:
      PROJECT_ROOT: .

tasks:
  docs/serve:
    desc: Serve documentation locally and rebuild on changes
    vars:
      DOCS_PORT: '{{.DOCS_PORT | default "8070"}}'
    cmds:
      - task: python:_uv/tool
        vars:
          CONTAINER_PORTS: '127.0.0.1:{{.DOCS_PORT}}:{{.DOCS_PORT}}'
          CONTAINER_ENVS: PYTHONUNBUFFERED=1
          CMD: >-
            uv run --locked --group docs sphinx-autobuild
            --host 0.0.0.0 --port {{.DOCS_PORT}}
            --watch src/limanix --watch limanix.example.toml
            --watch docs/conf.py --watch docs/generate.py
            --watch docs/_static
            --ignore '*/_generated/*'
            -E -a -W --keep-going -c docs docs/pages build/docs

  docs/generate:
    desc: Generate the example configuration from the Python model
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: uv run --locked python docs/generate.py

  ci/docs:
    desc: Check the example and build static documentation
    cmds:
      - task: python:_uv/tool
        vars:
          CMD: >-
            sh -eu -c 'uv run --locked --group docs python -m unittest discover -s docs -p "test_*.py" &&
            uv run --locked --group docs python docs/generate.py --check &&
            uv run --locked --group docs sphinx-build -E -W --keep-going -b html -c docs docs/pages build/docs'

  ci/fmt:
    desc: Check Python formatting
    cmds:
      - task: python:fmt

  ci/lint:
    desc: Lint Python
    cmds:
      - task: python:lint

  ci/typecheck:
    desc: Check Python types
    cmds:
      - task: python:typecheck

  ci/build:
    desc: Build the Python sdist and wheel
    cmds:
      - task: python:build

  ci/package-check:
    desc: Build and verify the installed wheel
    cmds:
      - task: ci/build
      - task: python:package/check
        vars:
          PACKAGE_COMMAND: python -m unittest discover -s /workspace/tests

  ci/tag:
    desc: Check RELEASE_TAG against the package version
    requires:
      vars: [RELEASE_TAG]
    cmds:
      - task: python:tag/check
        vars:
          RELEASE_TAG: '{{.RELEASE_TAG}}'
