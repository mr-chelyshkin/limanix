name: PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  label-check:
    name: Label check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-changelog-label@v1

  go:
    uses: mr-chelyshkin/actions/.github/workflows/pr-golang.yml@v1
    permissions:
      contents: read
    with:
      cache-path: .cache/go
      cache-key-prefix: limanix-go-v1
      cache-dependency-path: '**/go.sum'

  tf:
    uses: mr-chelyshkin/actions/.github/workflows/pr-terraform.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      terraform-role-arn: ${{ vars.AWS_TERRAFORM_DEPLOY_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION }}
      environment: |
        {
          "TF_STATE_KEY": ${{ toJSON(vars.TF_STATE_KEY) }},
          "TF_VAR_aws_region": ${{ toJSON(vars.AWS_REGION) }},
          "TF_STATE_REGION": ${{ toJSON(vars.TF_STATE_REGION) }},
          "TF_STATE_BUCKET": ${{ toJSON(vars.TF_STATE_BUCKET) }},
          "TF_VAR_domain_name": ${{ toJSON(vars.SITE_DOMAIN_NAME) }},
          "TF_VAR_site_bucket_name": ${{ toJSON(vars.SITE_BUCKET_NAME) }},
          "TF_VAR_acm_certificate_arn": ${{ toJSON(vars.SITE_ACM_CERTIFICATE_ARN) }}
        }

  limanix-build:
    name: limanix build
    needs: go
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Task
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/task-bin" go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
      - name: Build and sign macOS binaries
        shell: bash
        env:
          TASK_X_REMOTE_TASKFILES: '1'
        run: task --yes ci/build

  docs-build:
    name: Docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/invoke-taskfile@v1
        with: { command: ci/docs }

  gate:
    if: always()
    needs: [label-check, go, tf, limanix-build, docs-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: mr-chelyshkin/actions/check-job-results@v1
        with:
          results: ${{ toJSON(needs) }}
